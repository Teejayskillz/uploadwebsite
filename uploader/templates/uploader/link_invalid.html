<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Link unavailable</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#f8fafc; color:#0f172a; padding:24px; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:14px; padding:32px;
          max-width:460px; text-align:center; }
  h1 { font-size:20px; margin:0 0 10px; }
  p { color:#64748b; font-size:14px; line-height:1.5; margin:0 0 18px; }
  a { display:inline-block; background:#0f766e; color:#fff; text-decoration:none;
      border-radius:10px; padding:12px 20px; font-weight:600; }
</style>
</head>
<body>
  <div class="card">
    <h1>This download link is unavailable</h1>
    <p>{{ detail|default:"The link may have expired, been used already, or been copied incorrectly." }}</p>
    <a href="https://nzdworld.com/">Back to NZDWorld</a>
  </div>
</body>
</html>
